name: iOS Build (unsigned)

# Mac 없이 클라우드(macOS 러너)에서 iOS 앱을 빌드합니다.
# 공개 저장소이므로 macOS 러너 사용이 무료입니다.
# 결과물: 서명되지 않은 .ipa (아티팩트로 업로드)
#  → Sideloadly(윈도우) + 무료 Apple ID 로 본인 아이폰에 설치 가능(7일마다 갱신)
#  → App Store/TestFlight 배포는 Apple Developer($99/년) + 서명 필요

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm install

      - name: Sync web assets → Capacitor (frontend → www → ios)
        run: npm run cap:sync

      - name: Install CocoaPods
        working-directory: mobile/ios/App
        run: pod install

      - name: Build unsigned archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        working-directory: mobile/ios/App/build
        run: |
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/App.app
          zip -qry sonju-yakbang-unsigned.ipa Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonju-yakbang-ios-unsigned
          path: mobile/ios/App/build/sonju-yakbang-unsigned.ipa
          if-no-files-found: error
